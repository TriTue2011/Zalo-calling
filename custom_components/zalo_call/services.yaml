# SINH TU DONG bang zalo/zalo-pc-app/tools/gen_ha_catalog.py — dung sua tay.
send_message:
  name: send_message
  description: Gửi tin nhắn Zalo
  fields:
    entry_id: &id001
      name: Tài khoản Zalo Call
      description: Chọn tài khoản khi có nhiều tích hợp Zalo Call (bỏ trống = tài khoản đầu tiên).
      required: false
      selector:
        config_entry:
          integration: zalo_call
    thread_id:
      name: Mã hội thoại (threadId)
      description: UserId (1-1) hoặc GroupId (nhóm).
      required: true
      example: '5841349563795164131'
      selector:
        text: null
    type:
      name: Loại hội thoại
      description: user = 1-1, group = nhóm (nhận cả 0 / 1 như zalo_bot cũ).
      default: user
      selector:
        select:
          options:
          - user
          - group
          custom_value: true
    message:
      name: Nội dung tin nhắn
      description: Nội dung tin nhắn
      required: true
      selector: &id002
        text: null
      example: Hello từ Home Assistant
    mentions:
      name: 'Nhắc người trong NHÓM (chỉ áp dụng khi gửi vào nhóm): danh sách, mỗi mục {uid, name} (tìm
        «@name» trong tin) hoặc {uid, pos, len}; uid -1 = @Tất cả. Ví dụ: [{"uid": "123456", "name": "Nam"}]
        với tin «Chào @Nam»'
      description: 'Nhắc người trong NHÓM (chỉ áp dụng khi gửi vào nhóm): danh sách, mỗi mục {uid, name}
        (tìm «@name» trong tin) hoặc {uid, pos, len}; uid -1 = @Tất cả. Ví dụ: [{"uid": "123456", "name":
        "Nam"}] với tin «Chào @Nam»'
      required: false
      selector:
        object: null
    format:
      name: 'Định dạng chữ: plain (mặc định) hoặc markdown — **đậm**, *nghiêng*, __gạch chân__, ~~gạch
        ngang~~, # tiêu đề (to + đậm), - mục / 1. mục (danh sách), {red}chữ đỏ{/} {orange} {yellow} {green}
        (hoặc {đỏ} {cam} {vàng} {xanh}), {big}..{/} {small}..{/}'
      description: 'Định dạng chữ: plain (mặc định) hoặc markdown — **đậm**, *nghiêng*, __gạch chân__,
        ~~gạch ngang~~, # tiêu đề (to + đậm), - mục / 1. mục (danh sách), {red}chữ đỏ{/} {orange} {yellow}
        {green} (hoặc {đỏ} {cam} {vàng} {xanh}), {big}..{/} {small}..{/}'
      required: false
      selector:
        select:
          options:
          - plain
          - markdown
          mode: dropdown
    auto_emphasis:
      name: 'Tự nhấn mạnh con số (29°C, 75%, 15:30) và chữ đậm bằng màu: red, orange, yellow, green (hoặc
        đỏ, cam, vàng, xanh) hoặc true = đỏ. Để trống = tắt'
      description: 'Tự nhấn mạnh con số (29°C, 75%, 15:30) và chữ đậm bằng màu: red, orange, yellow, green
        (hoặc đỏ, cam, vàng, xanh) hoặc true = đỏ. Để trống = tắt'
      required: false
      selector:
        select:
          options:
          - red
          - orange
          - yellow
          - green
          custom_value: true
          mode: dropdown
    emoji:
      name: 'Emoji chèn vào đầu tin: chọn trong bảng hoặc gõ emoji bất kỳ (🎉). Mã :ten: trong chữ (ví
        dụ :ok:) cũng được đổi thành emoji'
      description: 'Emoji chèn vào đầu tin: chọn trong bảng hoặc gõ emoji bất kỳ (🎉). Mã :ten: trong chữ
        (ví dụ :ok:) cũng được đổi thành emoji'
