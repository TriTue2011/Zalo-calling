make_call:
  name: Gọi điện đi
  description: Gọi thoại hoặc video cho một người hay nhóm Zalo. Có thể chỉ gọi, hoặc đọc một thông báo
    rồi cúp, hoặc cho AI nói chuyện. Muốn báo động (có người ngã, cháy...) thì dùng «Gọi cảnh báo».
  fields:
    entry_id: *id001
    thread_id:
      name: Người hoặc nhóm cần gọi
      description: Mã Zalo của người (hoặc nhóm). Xem danh sách bằng dịch vụ «Xem danh bạ Zalo».
      required: true
      example: '6643404425553198601'
      selector:
        text: null
    type:
      name: Gọi thoại hay gọi video
      description: 'Thoại, video hoặc nhóm. Bỏ trống = tự chọn: nếu có camera sẽ dùng (tích Camera ở ô
        «Thiết bị nhà dùng khi người nhà nói trực tiếp») thì gọi video, không thì gọi thoại.'
      selector:
        select:
          options:
          - user
          - video
          - group
    peer_name:
      name: Tên hiện trong nhật ký
      description: Tên người nhận hiện trong nhật ký cuộc gọi (bỏ trống = dùng mã).
      selector:
        text: null
    srtp:
      name: Cách mã hoá tiếng (nâng cao)
      description: 'Thường để trống: hệ thống tự chọn cách đã chạy tốt.'
      selector:
        select:
          options:
          - sess
          - 'off'
          - key
    extend_profile:
      name: Kiểu kết nối với Zalo (nâng cao)
      description: Thường để trống.
      default: native
      selector:
        select:
          options:
          - native
          - pc
          - zca
    speaker:
      name: Loa trong nhà
      description: 'Loa phát tiếng người bên kia. Với cuộc gọi có AI: chỉ bật khi người nhà nói trực tiếp.'
      selector:
        entity:
          domain: media_player
    volume:
      name: Âm lượng loa (%)
      description: Đặt âm lượng khi bật loa, trả lại mức cũ khi cúp. Bỏ trống = giữ nguyên.
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: '%'
    mic:
      name: Mic trong nhà
      description: 'Camera hoặc vệ tinh Assist (loa R1, camera Imou/Dahua) có mic, để gửi tiếng trong
        nhà cho người bên kia. Với cuộc gọi có AI: chỉ bật khi người nhà nói trực tiếp.'
      selector:
        entity:
          domain:
          - camera
          - assist_satellite
    mic_url:
      name: Mic từ địa chỉ mạng (nâng cao)
      description: Địa chỉ rtsp/http của luồng tiếng, nếu mic không có trong danh sách. Thắng ô Mic.
      selector:
        text: null
    camera:
      name: Camera trong nhà
      description: 'Camera gửi hình cho người bên kia (cuộc gọi video). Với cuộc gọi có AI: chỉ bật khi
        người nhà nói trực tiếp.'
      selector:
        entity:
          domain: camera
    connect:
      name: Thiết bị nhà dùng khi người nhà nói trực tiếp
      description: 'Tích ô nào thì dùng thứ đó: tích 1 = dùng 1, tích 2 = dùng 2, tích 3 = dùng cả 3.
        Không tích gì = không dùng thiết bị nào (mặc định, người lạ không nghe hay thấy được trong nhà).
        Tích Camera = cuộc gọi VIDEO. «AI tự chọn» = AI quyết dùng mic và loa hay thêm cả camera, chỉ
        trong các ô đã tích. Chỉ dùng được thiết bị đã chọn ở các ô Loa, Mic, Camera bên dưới. Thiết bị
        chỉ bật khi người nhà nói trực tiếp, lúc AI còn đang giữ máy thì chưa bật.'
      selector:
        select:
          options: &id025
          - &id022
            value: mic
            label: Mic - gửi tiếng trong nhà cho người gọi
          - &id023
            value: speaker
            label: Loa - phát tiếng người gọi ra loa trong nhà
          - &id024
            value: camera
            label: Camera - gửi hình trong nhà (tích ô này là cuộc gọi VIDEO)
          - value: ai
            label: AI tự chọn trong các ô đã tích
          multiple: true
    connect_now:
      name: Thiết bị nhà dùng NGAY khi người nhận nghe máy
      description: Tích ô nào thì thứ đó bật ngay khi người nhận nghe máy, không chờ người nhà nói trực
        tiếp (ví dụ tích Camera để người nhận thấy hình trong nhà ngay, còn Mic và Loa chỉ bật khi người
        nhà nói). Tích Camera = cuộc gọi VIDEO. Không tích gì = chưa bật gì (mặc định). Chỉ bật được thiết
        bị đã chọn ở các ô Loa, Mic, Camera.
      selector:
        select:
          options: &id026
          - *id022
          - *id023
          - *id024
          multiple: true
    message:
      name: Nội dung đọc khi người nhận nghe máy
      description: Câu được đọc bằng giọng nói ngay khi nghe máy. Bỏ trống = không đọc gì.
      selector:
        text:
          multiline: true
    repeat:
      name: Đọc mấy lần
      description: Số lần đọc (1 đến 3).
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    ai:
      name: Cho AI nói chuyện
      description: AI nghe người bên kia và trả lời bằng giọng nói, tới khi họ nói không cần gì nữa, cúp
        máy, im lặng quá lâu hoặc 10 phút. Cần chọn Trợ lý giọng nói (hoặc đã đặt quy tắc cho người này).
      default: false
      selector:
        boolean: null
    hangup_after:
      name: Tự cúp máy khi xong
      description: 'Cúp máy sau khi đọc xong thông báo, và sau khi AI nói chuyện xong. Mặc định: bật.'
      default: true
      selector:
        boolean: null
    greeting:
      name: Câu AI chào đầu tiên
      description: AI nói câu này ngay khi người nhận nghe máy (chỉ khi cho AI nói chuyện mà không có
        nội dung thông báo). Bỏ trống = câu chào trong quy tắc, không có thì «Xin chào, tôi là trợ lý
        của gia đình. Bạn cần gì ạ?».
      selector:
        text: null
    handover_rule:
      name: AI chuyển cho người nhà khi...
      description: Thêm điều kiện riêng để AI chuyển cuộc gọi cho người nhà nói trực tiếp. Mặc định AI
        đã tự chuyển khi người gọi muốn gặp người trong nhà, có việc khẩn cấp hoặc AI không giúp được.
        Khi chuyển, cuộc gọi không bị cúp, thiết bị nhà bật theo ô «Thiết bị nhà dùng khi người nhà nói
        trực tiếp», và Home Assistant bắn sự kiện zalo_call_ai_handover.
      selector:
        text: null
    tts_engine:
      name: Giọng đọc riêng
      description: Chọn nếu muốn dùng giọng khác. Bỏ trống = giọng của Trợ lý giọng nói.
      selector:
        entity:
          domain: tts
    language:
      name: Ngôn ngữ
      description: Ví dụ vi. Bỏ trống = theo Trợ lý giọng nói.
      selector:
        text: null
    pipeline:
      name: Trợ lý giọng nói (Assist)
      description: Bộ nghe - hiểu - nói của Home Assistant (Cài đặt, Trợ lý giọng nói). Khi cho AI nói
        chuyện, AI nghe người gọi, trả lời và đọc bằng giọng của bộ này. Bắt buộc chọn nếu cho AI nói
        chuyện (không tự dùng bộ ưu tiên vì nó có quyền điều khiển thiết bị trong nhà).
      selector:
        assist_pipeline: null
    agent:
      name: Trợ lý AI riêng (không bắt buộc)
      description: Chỉ chọn nếu muốn dùng một trợ lý AI khác với trợ lý trong Trợ lý giọng nói. Với người
        lạ, nên chọn trợ lý KHÔNG điều khiển được thiết bị trong nhà.
      selector:
        conversation_agent: null
