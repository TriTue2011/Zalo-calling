upgrade_to_video:
  name: Chuyển cuộc gọi thoại sang video
  description: Khi đang gọi thoại, xin bên kia chuyển sang video rồi phát camera đã chọn (hoặc camera
    mặc định).
  fields:
    entry_id: *id001
    call_id:
      name: Mã cuộc gọi
      description: Bỏ trống để dùng cuộc gọi đang diễn ra.
      selector:
        text: null
    camera:
      name: Camera
      description: Camera HA phát hình. Bỏ trống = camera mặc định.
      selector:
        entity:
          domain: camera
    camera_url:
      name: Camera từ URL
      description: rtsp/rtsps/http/https/rtmp (thắng ô Camera).
      selector:
        text: null
start_call_video:
  name: Bật hình trong cuộc gọi
  description: Phát hình camera lên cuộc gọi đang diễn ra (không xin chuyển loại cuộc gọi).
  fields:
    entry_id: *id001
    call_id:
      name: Mã cuộc gọi
      description: Bỏ trống để dùng cuộc gọi đang diễn ra.
      selector:
        text: null
    camera:
      name: Camera
      description: Camera HA phát hình. Bỏ trống = camera mặc định.
      selector:
        entity:
          domain: camera
    camera_url:
      name: Camera từ URL
      description: rtsp/rtsps/http/https/rtmp (thắng ô Camera).
      selector:
        text: null
stop_call_video:
  name: Tắt hình trong cuộc gọi
  description: Dừng phát hình camera lên cuộc gọi đang diễn ra.
  fields:
    entry_id: *id001
    call_id:
      name: Mã cuộc gọi
      description: Bỏ trống để dùng cuộc gọi đang diễn ra.
      selector:
        text: null
start_call_mic:
  name: Bật mic trong cuộc gọi
  description: Phát tiếng từ camera, vệ tinh Assist (camera Imou/Dahua, loa R1) hoặc URL lên cuộc gọi
    đang diễn ra.
  fields:
    entry_id: *id001
    call_id:
      name: Mã cuộc gọi
      description: Bỏ trống để dùng cuộc gọi đang diễn ra.
      selector:
        text: null
    mic:
      name: Mic
      description: Camera hoặc vệ tinh Assist. Bỏ trống = mic mặc định.
      selector:
        entity:
          domain:
          - camera
          - assist_satellite
    mic_url:
      name: Mic từ URL
      description: rtsp/rtsps/http/https/rtmp, hoặc luồng PCM của loa R1 (thắng ô Mic).
      selector:
        text: null
stop_call_mic:
  name: Tắt mic trong cuộc gọi
  description: Dừng phát tiếng lên cuộc gọi đang diễn ra.
  fields:
    entry_id: *id001
    call_id:
      name: Mã cuộc gọi
      description: Bỏ trống để dùng cuộc gọi đang diễn ra.
      selector:
        text: null
set_default_devices:
  name: Đặt thiết bị mặc định
  description: Đặt các chế độ tự động mặc định (tự phát mic, tự đồng ý video, chống vọng, âm lượng) và
    độ to phần mềm của mic/loa, tham số chống vọng trễ. Loa, mic, camera KHÔNG còn mặc định - do quy tắc/automation
    chọn cho từng cuộc gọi. Trường nào bỏ trống thì giữ nguyên.
  fields:
    entry_id: *id001
    auto_mic:
      name: Tự phát mic khi nghe máy
      description: Bật thì tự phát mic mặc định ngay khi cuộc gọi được nghe máy.
      selector:
        boolean: null
    auto_video:
      name: Tự đồng ý khi bên kia xin gọi video (mọi người)
      description: Bật thì khi BẤT KỲ AI xin chuyển sang video app cũng tự đồng ý và phát camera mặc định,
        không xét quy tắc từng người. Nên TẮT và dùng công tắc «Cho phép đồng ý chuyển sang video» cùng
        quy tắc từng người (video_request) để chỉ người được phép mới tự đồng ý.
      selector:
        boolean: null
    video_consent:
      name: Cho phép đồng ý chuyển sang video (công tắc tổng)
      description: Công tắc tổng, mặc định TẮT. Bật thì quy tắc video_request (accept, accept_camera)
        của từng người/nhóm mới được tự đồng ý khi họ xin chuyển sang video; tắt thì mọi người chỉ bị
        báo. Cũng là công tắc «Cho phép đồng ý chuyển sang video» trên thiết bị Zalo Call.
      selector:
        boolean: null
    echo_guard:
      name: Chống vọng
      description: auto = chỉ chặn mic khi mic và loa là cùng một thiết bị (ví dụ R1); on = luôn chặn
        mic khi loa đang phát tiếng bên kia; duplex = song công, nói chen được (loa R1 dùng khử vọng của
        nó); off = tắt.
      selector:
        select:
          options:
          - auto
          - 'on'
          - duplex
          - 'off'
    auto_video_delay:
      name: Chờ trước khi tự đồng ý (giây)
      description: Số giây chờ rồi mới tự đồng ý lời xin chuyển sang video (0 = đồng ý ngay; chỉ áp dụng
        khi cuộc gọi còn đang nói).
      selector:
        number:
          min: 0
          max: 120
          mode: box
          unit_of_measurement: s
    call_volume:
      name: Âm lượng cuộc gọi mặc định
      description: 1-100 % — âm lượng loa đặt khi nghe máy rồi trả lại khi cuộc gọi kết thúc; 0 = giữ
        nguyên âm lượng loa.
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: '%'
    mic_gain:
      name: Độ to mic gửi sang bên kia (phần mềm, %)
      description: Độ to PHẦN MỀM của tiếng mic gửi đi, độc lập với cài đặt của loa R1. 100 % = 0 dB (giữ
        nguyên), 200 % = +6 dB, 50 % = −6 dB; 0 = giữ nguyên. Là mặc định cho mọi cuộc gọi; quy tắc (set_rule),
        make_call/answer_call và nút −/+ trên WebUI ghi đè. Ghi thẳng vào app nên WebUI hiện đúng giá
        trị này.
      selector:
        number:
          min: 0
          max: 300
          step: 5
          mode: slider
          unit_of_measurement: '%'
    speaker_gain:
      name: Độ to tiếng bên kia ra loa (phần mềm, %)
      description: Độ to PHẦN MỀM của tiếng bên kia phát ra loa. 100 % = 0 dB, 0 = giữ nguyên. Mặc định
        cho mọi cuộc gọi; quy tắc và nút −/+ ghi đè.
      selector:
        number:
          min: 0
          max: 300
          step: 5
          mode: slider
          unit_of_measurement: '%'
    echo_delay_min_ms:
      name: Chống vọng — trễ loa→mic thấp nhất (ms)
      description: Cửa sổ trễ để nhận ra VỌNG TRỄ của loa song công (loa R1 đo được 450–550 ms). Phải
        đi cùng «trễ cao nhất» và nhỏ hơn nó; cùng 0 = tắt bù trễ. Mặc định máy chủ 300–750.
      selector:
        number:
          min: 0
          max: 3000
          step: 10
          mode: box
          unit_of_measurement: ms
    echo_delay_max_ms:
      name: Chống vọng — trễ loa→mic cao nhất (ms)
      description: Xem «trễ thấp nhất». Mic nhỏ hơn «ngưỡng × tiếng loa» trong cửa sổ trễ này bị coi là
        vọng và không gửi; to hơn (người nhà nói chen) thì cho qua.
      selector:
        number:
          min: 0
          max: 3000
          step: 10
          mode: box
          unit_of_measurement: ms
    echo_ratio:
      name: Chống vọng — ngưỡng (×)
      description: Mic bị coi là vọng khi to < ngưỡng × đỉnh tiếng loa trong cửa sổ trễ. Mặc định 2,0;
        tăng nếu vẫn lọt vọng, giảm nếu người nhà nói chen bị cắt.
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.1
          mode: box
    echo_use_default:
      name: Chống vọng — trở về mặc định của máy chủ
      description: Bật để xóa cả ba giá trị chống vọng trễ ở trên và theo mặc định / biến môi trường ZALO_PC_ECHO_*
        của máy chủ.
      selector:
        boolean: null
    client:
      name: Kiểu đăng nhập
      description: Web và PC là hai phiên Zalo riêng nên app lưu bộ cài đặt thiết bị RIÊNG cho từng kiểu
        (độ to, chống vọng, nguồn mic/camera…). Chọn bộ của kiểu nào sẽ được sửa; bỏ trống = kiểu đang
        đăng nhập. Kiểu đang dùng xem ở thuộc tính «kieu_dang_nhap» của cảm biến trạng thái Zalo.
      selector:
        select:
          options:
          - web
          - pc
say_in_call:
  name: Đọc lên cuộc gọi (TTS)
  description: Đọc một câu bằng TTS của HA lên cuộc gọi đang nói.
  fields:
    entry_id: *id001
    message:
      name: Nội dung
      description: Câu cần đọc.
      required: true
      selector:
        text:
          multiline: true
    call_id:
      name: Mã cuộc gọi
      description: Bỏ trống = cuộc gọi đang nói hiện tại.
      selector:
        text: null
    tts_engine:
      name: Giọng đọc (TTS)
      description: Thực thể tts.*; bỏ trống = mặc định của HA.
      selector:
        entity:
          domain: tts
    language:
      name: Ngôn ngữ
      description: Ví dụ vi.
      selector:
        text: null
    wait:
      name: Chờ đọc xong
      description: Chờ đọc xong mới trả về.
      default: true
      selector:
        boolean: null
take_over_call:
  name: Người nhà nói trực tiếp (dừng AI)
  description: Dừng AI đang giữ cuộc gọi và bật thiết bị nhà để người trong nhà nói chuyện trực tiếp với
    người gọi.
  fields:
    entry_id: *id001
    call_id:
      name: Mã cuộc gọi
      description: Bỏ trống = cuộc gọi đang nói hiện tại.
      selector:
        text: null
accept_video:
  name: Đồng ý chuyển sang video
  description: Người đang gọi thoại xin chuyển sang video, bạn đồng ý. Chọn Camera để gửi hình trong nhà;
    không chọn thì chỉ đồng ý (người gọi thấy mình, nhưng không thấy hình trong nhà). Chỉ dùng được khi
    cuộc gọi đang nói.
  fields:
    entry_id: *id001
    call_id:
      name: Mã cuộc gọi
      description: Bỏ trống = cuộc gọi đang nói hiện tại.
      selector:
        text: null
    camera:
      name: Camera
      description: Camera gửi hình.
      selector:
        entity:
          domain: camera
set_rule:
  name: Đặt quy tắc cho cuộc gọi đến và tin nhắn
  description: Quy định hệ thống làm gì khi có người gọi hoặc nhắn đến. Chưa có quy tắc cho người đó thì
    hệ thống KHÔNG làm gì (chỉ đổ chuông, không trả lời tin nhắn). Quy tắc cho một người hoặc nhóm cụ
    thể được ưu tiên hơn quy tắc chung. Ô nào không điền thì giữ nguyên như cũ; quy tắc mới mặc định TẮT
    hết và không dùng thiết bị nhà.
  fields:
    entry_id: *id001
    scope:
      name: Áp dụng cho
      description: Chọn đối tượng của quy tắc. «Một người hoặc một nhóm cụ thể» thì điền thêm Mã Zalo
        bên dưới.
      required: true
      selector:
        select:
          options: &id027
          - value: thread
            label: Một người hoặc một nhóm cụ thể
          - value: tag
            label: Mọi người mang một thẻ (điền ô Thẻ)
          - value: groups
            label: Mọi nhóm
          - value: contacts
            label: Mọi người trong danh bạ
          - value: strangers
            label: Mọi người lạ
    thread_id:
      name: Mã Zalo của người hoặc nhóm
      description: Chỉ cần khi chọn «Một người hoặc một nhóm cụ thể». Xem danh sách bằng dịch vụ «Xem
        danh bạ Zalo».
      example: '6643404425553198601'
      selector:
        text: null
    tag:
      name: Thẻ
      description: Chỉ cần khi chọn «Mọi người mang một thẻ». Gắn thẻ cho người bằng dịch vụ «Gắn thẻ
        và ghi chú cho người».
      example: gia đình
      selector:
        text: null
    name:
      name: Tên gọi (để bạn nhớ)
      description: Tên hiển thị trong các thông báo, ví dụ «Con trai».
      selector:
        text: null
    answer:
      name: Tự nghe máy
      description: Cuộc gọi 1-1 đến từ người thuộc quy tắc này sẽ tự được nghe sau thời gian chờ.
      selector:
        boolean: null
    answer_delay:
      name: Nghe máy sau (giây)
      description: Từ 0 đến 120 giây. Người gọi cúp trước khi hết giờ thì không nghe.
      default: 3
      selector:
        number:
          min: 0
          max: 120
          mode: box
          unit_of_measurement: s
    call_types:
      name: Nghe loại cuộc gọi nào
      description: voice = thoại, video = video, hoặc cả hai.
      default:
      - voice
      - video
      selector:
        select:
          options:
          - value: voice
            label: Thoại
          - value: video
            label: Video
          multiple: true
    ai:
      name: Cho AI nói chuyện khi nghe máy
      description: Sau khi nghe máy, AI nghe và trả lời bằng giọng nói. Cần chọn Trợ lý giọng nói hoặc
        Trợ lý AI riêng.
      selector:
        boolean: null
    pipeline:
      name: Trợ lý giọng nói (Assist)
      description: Bộ nghe - hiểu - nói của Home Assistant (Cài đặt, Trợ lý giọng nói). Khi cho AI nói
        chuyện, AI nghe người gọi, trả lời và đọc bằng giọng của bộ này. Bắt buộc chọn nếu cho AI nói
        chuyện (không tự dùng bộ ưu tiên vì nó có quyền điều khiển thiết bị trong nhà).
      selector:
        assist_pipeline: null
    agent:
      name: Trợ lý AI riêng (không bắt buộc)
      description: Chỉ chọn nếu muốn dùng một trợ lý AI khác với trợ lý trong Trợ lý giọng nói. Với người
        lạ, nên chọn trợ lý KHÔNG điều khiển được thiết bị trong nhà.
      selector:
        conversation_agent: null
    greeting:
      name: Câu AI chào khi nghe máy
      description: Bỏ trống = «Xin chào, tôi là trợ lý của gia đình. Bạn cần gì ạ?».
      selector:
        text: null
    handover_rule:
      name: AI chuyển cho người nhà khi...
      description: Thêm điều kiện riêng để AI chuyển cuộc gọi cho người nhà nói trực tiếp. Mặc định AI
        đã tự chuyển khi người gọi muốn gặp người trong nhà, có việc khẩn cấp hoặc AI không giúp được.
        Khi chuyển, cuộc gọi không bị cúp, thiết bị nhà bật theo ô «Thiết bị nhà dùng khi người nhà nói
        trực tiếp», và Home Assistant bắn sự kiện zalo_call_ai_handover.
      selector:
        text: null
    trusted:
      name: Người tin cậy
      description: Tin cậy thì AI nói chuyện bình thường. Không tin cậy (mặc định) thì AI được dặn không
        tiết lộ thông tin gia đình và không điều khiển thiết bị.
      selector:
        boolean: null
    reply_ai:
      name: AI trả lời tin nhắn
      description: AI trả lời tin chữ (và tin thoại nếu bật chuyển tin thoại thành chữ) của người hoặc
        nhóm này. Cần chọn Trợ lý giọng nói hoặc Trợ lý AI riêng.
      selector:
        boolean: null
    voice_text:
      name: Chuyển tin thoại thành chữ
      description: Tin thoại 1-1 được Zalo chuyển thành chữ, và Home Assistant bắn sự kiện zalo_call_voice_text.
      selector:
        boolean: null
    reply_trigger:
      name: Từ khóa gọi AI trong nhóm
      description: Chỉ áp cho NHÓM. Tin có từ này (không phân biệt hoa thường, ví dụ `@Bot`) mới được
        AI trả lời; từ khóa được bỏ khỏi câu hỏi. Để trống = AI trả lời mọi tin của nhóm.
      selector:
        text: null
    reply_senders:
      name: Người được gọi AI trong nhóm
      description: Chỉ áp cho NHÓM. Mã Zalo (threadID) của những người được phép gọi AI, cách nhau dấu
        phẩy. Để trống = mọi thành viên. Dán mã dài 19 chữ số hay mã số ngắn đều được.
      selector:
        text: null
    reply_quote:
      name: Trả lời kèm trích dẫn tin gốc
      description: Câu trả lời của AI trích dẫn đúng tin vừa hỏi (như zalo_bot). Chỉ với tin chữ; không
        trích được thì gửi tin thường.
      selector:
        boolean: null
    reply_prefix:
      name: Tiền tố câu trả lời
      description: Chữ thêm vào đầu câu trả lời của AI, ví dụ `Bot-Hass:`.
      selector:
        text: null
    announce:
      name: Báo ra loa khi có cuộc gọi đến
      description: Bật thì khi người này gọi đến, một loa trong nhà đọc «Có cuộc gọi ... từ ...» để người
        trong nhà biết (kể cả khi không tự nghe máy). Mặc định TẮT.
      default: false
      selector:
        boolean: null
    announce_to:
      name: Loa dùng để báo
      description: Loa đọc thông báo cuộc gọi đến (bắt buộc khi bật báo ra loa). Giọng đọc lấy từ Trợ
        lý giọng nói của quy tắc.
      selector:
        entity:
          domain: media_player
    announce_text:
      name: Câu báo ra loa
      description: Có thể dùng {ten} (tên người gọi) và {loai} (thoại hoặc video). Bỏ trống = «Có cuộc
        gọi {loai} từ {ten}.»
      selector:
        text: null
    announce_volume:
      name: Âm lượng lúc báo (%)
      description: 'Âm lượng của loa khi đọc thông báo có cuộc gọi đến. 0 = giữ nguyên. Không ai nghe
        máy thì loa trở về mức cũ; có người nghe thì cuộc gọi tự đặt âm lượng của nó. Loa R1 có 15 mức:
        6/15 là 40%.'
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: '%'
    announce_repeat:
      name: Báo lại sau mỗi (giây)
      description: Đọc xong thông báo thì chờ chừng này giây rồi đọc lại, cứ thế tới khi có người nghe
        máy hoặc cuộc gọi kết thúc. 0 = chỉ báo một lần.
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: giây
    connect_now:
      name: Thiết bị nhà dùng NGAY khi người nhận nghe máy
      description: Tích ô nào thì thứ đó bật ngay khi người nhận nghe máy, không chờ người nhà nói trực
        tiếp (ví dụ tích Camera để người nhận thấy hình trong nhà ngay, còn Mic và Loa chỉ bật khi người
        nhà nói). Tích Camera = cuộc gọi VIDEO. Không tích gì = chưa bật gì (mặc định). Chỉ bật được thiết
        bị đã chọn ở các ô Loa, Mic, Camera.
      selector:
        select:
          options: *id026
          multiple: true
    video_request:
      name: Khi người gọi xin chuyển sang video
      description: 'Người đang gọi thoại có thể xin chuyển sang video. Mặc định KHÔNG tự đồng ý (riêng
        tư): chỉ báo cho automation qua sự kiện zalo_call_call_state (trạng thái video_request). Chọn
        đồng ý nếu muốn tự động, nhưng chỉ có tác dụng khi công tắc «Cho phép đồng ý chuyển sang video»
        trên thiết bị Zalo Call đang BẬT (mặc định TẮT).'
      selector:
        select:
          options:
          - value: ask
            label: Không tự đồng ý (chỉ báo cho automation, mặc định)
          - value: accept
            label: Tự đồng ý, KHÔNG gửi hình trong nhà
          - value: accept_camera
            label: Tự đồng ý và gửi camera đã chọn bên dưới
    connect:
      name: Thiết bị nhà dùng khi người nhà nói trực tiếp
      description: 'Tích ô nào thì dùng thứ đó: tích 1 = dùng 1, tích 2 = dùng 2, tích 3 = dùng cả 3.
        Không tích gì = không dùng thiết bị nào (mặc định, người lạ không nghe hay thấy được trong nhà).
        Tích Camera = cuộc gọi VIDEO. «AI tự chọn» = AI quyết dùng mic và loa hay thêm cả camera, chỉ
        trong các ô đã tích. Chỉ dùng được thiết bị đã chọn ở các ô Loa, Mic, Camera bên dưới. Thiết bị
        chỉ bật khi người nhà nói trực tiếp, lúc AI còn đang giữ máy thì chưa bật.'
      selector:
        select:
          options: *id025
          multiple: true
    speaker:
      name: Loa trong nhà
      description: Loa phát tiếng người gọi khi người nhà nói trực tiếp.
      selector:
        entity:
          domain: media_player
    mic:
      name: Mic trong nhà
      description: Camera hoặc vệ tinh Assist có mic, gửi tiếng trong nhà cho người gọi khi người nhà
        nói trực tiếp.
      selector:
        entity:
          domain:
          - camera
          - assist_satellite
    mic_url:
      name: Mic từ địa chỉ mạng (nâng cao)
      description: Địa chỉ rtsp/http của luồng tiếng, nếu mic không có trong danh sách. Thắng ô Mic.
      selector:
        text: null
    camera:
      name: Camera trong nhà
      description: Camera gửi hình cho người gọi khi người nhà nói trực tiếp (cuộc gọi video).
      selector:
        entity:
          domain: camera
    volume:
      name: Âm lượng loa (%)
      description: Từ 0 đến 100. 0 = giữ nguyên.
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: '%'
    echo_guard:
      name: Chống vọng âm
      description: Tránh tiếng loa lọt ngược vào mic khi hai thứ cùng một thiết bị.
      selector:
        select:
          options:
          - auto
          - 'on'
          - duplex
          - 'off'
remove_rule:
  name: Xoá quy tắc
  description: Xoá quy tắc của một người/nhóm cụ thể hoặc của một nhóm đối tượng. Từ đó hệ thống quay
    về «không làm gì» với họ.
  fields:
    entry_id: *id001
    scope:
      name: Áp dụng cho
      description: Chọn đối tượng của quy tắc. «Một người hoặc một nhóm cụ thể» thì điền thêm Mã Zalo
        bên dưới.
      required: true
      selector:
        select:
          options: *id027
    thread_id:
      name: Mã Zalo của người hoặc nhóm
      description: Chỉ cần khi chọn «Một người hoặc một nhóm cụ thể». Xem danh sách bằng dịch vụ «Xem
        danh bạ Zalo».
      selector:
        text: null
    tag:
      name: Thẻ
      description: Chỉ cần khi chọn «Mọi người mang một thẻ». Gắn thẻ cho người bằng dịch vụ «Gắn thẻ
        và ghi chú cho người».
      selector:
        text: null
set_contact_tags:
  name: Gắn thẻ và ghi chú cho người
  description: Gắn thẻ (ví dụ «gia đình») và ghi chú cho một người hoặc nhóm. Đặt quy tắc cho một thẻ
    (dịch vụ «Đặt quy tắc…», chọn «Mọi người mang một thẻ») thì tất cả người mang thẻ đó dùng quy tắc
    ấy, khỏi đặt từng người. Ô nào không điền thì giữ nguyên; để trống ô Thẻ là gỡ hết thẻ.
  fields:
    entry_id: *id001
    thread_id:
      name: ThreadID (gõ tay)
      description: ID Zalo của người hoặc nhóm. Lấy danh sách bằng dịch vụ list_contacts.
      required: true
      example: '6643404425553198601'
      selector:
        text: null
    tags:
      name: Thẻ
      description: Các thẻ cách nhau bằng dấu phẩy, ví dụ gia đình, người lớn tuổi. Tối đa 10 thẻ, không
        phân biệt hoa thường.
      example: gia đình, người lớn tuổi
      selector:
        text: null
    note:
      name: Ghi chú
      description: Ghi chú ngắn về người này (tối đa 500 ký tự).
      selector:
        text:
          multiline: true
list_rules:
  name: Xem các quy tắc
  description: Trả về mọi quy tắc đang đặt.
  fields:
    entry_id: *id001
list_contacts:
  name: Xem danh bạ Zalo
  description: Danh sách bạn bè và nhóm kèm mã Zalo, để điền vào các ô «Mã Zalo».
  fields:
    entry_id: *id001
get_default_devices:
  name: Xem mic/loa/camera mặc định
  description: Trả về cài đặt thiết bị mặc định hiện tại, gồm độ to mic/loa và chống vọng đọc từ app (đặt
    bằng set_default_devices, WebUI hoặc thực thể số).
  fields:
    entry_id: *id001
    client:
      name: Kiểu đăng nhập
      description: Xem bộ cài đặt của kiểu đăng nhập nào (web hoặc pc); bỏ trống = kiểu đang dùng. Kết
        quả kèm «kieu_dang_nhap» (bộ đang xem) và «kieu_dang_nhap_dang_dung».
      selector:
        select:
          options:
          - web
          - pc
get_app_settings:
  name: Đọc cài đặt của app
  description: 'Đọc mọi cài đặt của app Zalo Call (tài khoản app, webhook, thiết bị, lưu trữ, proxy, bảo
    mật, đồng bộ lịch sử) cùng cài đặt phía HA. Dùng để cấu hình/sao lưu từ HA, nhất là khi app chạy không
    có giao diện web. Bí mật (địa chỉ webhook, mật khẩu) bị che trừ khi bật «Hiện bí mật». Mật khẩu app
    được app lưu dạng băm nên không đọc ngược được: «Hiện bí mật» chỉ cho thấy mật khẩu HA đang dùng.'
  fields:
    entry_id: *id001
    sections:
      name: Mục cần đọc
      description: Bỏ trống để đọc tất cả.
      selector:
        select:
          multiple: true
          options:
          - label: Tài khoản app
            value: app
          - label: Webhook
            value: webhooks
          - label: Thiết bị mặc định của app
            value: devices
          - label: Lưu trữ / dọn dữ liệu
            value: retention
          - label: Proxy
            value: proxy
          - label: Bảo mật
            value: security
          - label: Đồng bộ lịch sử
            value: history_sync
    reveal_secrets:
      name: Hiện bí mật
      description: Bật thì phản hồi chứa địa chỉ webhook đầy đủ và mật khẩu HA dùng với app. Phản hồi
        có thể nằm trong vết chạy automation, nên chỉ bật khi cần.
      selector:
        boolean: null
set_app_settings:
  name: Ghi cài đặt của app
  description: 'Ghi một mục cài đặt của app. App tự kiểm giá trị và báo lỗi rõ ràng. Ví dụ: mục «webhooks»
    với {"message_webhook_url": "...", "message_enabled": true}; mục «retention» với các khóa của app;
    mục «proxy» với {"action": "add", "url": "..."}.'
  fields:
    entry_id: *id001
    section:
      name: Mục cài đặt
      description: Mục cần ghi.
      required: true
      selector:
        select:
          options:
          - label: Webhook
            value: webhooks
          - label: Thiết bị mặc định của app
            value: devices
          - label: Lưu trữ / dọn dữ liệu
            value: retention
          - label: Proxy
            value: proxy
          - label: Bảo mật (thu hồi phiên)
            value: security
    values:
      name: Giá trị
      description: Các khóa cần đổi của mục đó (đối tượng YAML/JSON).
      required: true
      selector:
        object: null
set_app_password:
  name: Đổi mật khẩu app
  description: Đổi mật khẩu đăng nhập app Zalo Call và cập nhật luôn mật khẩu HA dùng với app (tích hợp
    tự tải lại). Các phiên khác của app bị thu hồi. Không đổi được nếu mật khẩu app đặt bằng biến môi
    trường.
  fields:
    entry_id: *id001
    old_password:
      name: Mật khẩu cũ
      description: Mật khẩu app hiện tại.
      required: true
      selector:
        text:
          type: password
    new_password:
      name: Mật khẩu mới
      description: Mật khẩu app mới (app kiểm độ dài/độ mạnh).
      required: true
      selector:
        text:
          type: password
test_webhook:
  name: Gửi thử webhook
  description: Gửi thử một loại webhook từ app sang HA để kiểm đường nhận.
  fields:
    entry_id: *id001
    kind:
      name: Loại webhook
      description: Loại sự kiện gửi thử.
      required: true
      selector:
        select:
          options:
          - label: Tin nhắn
            value: message
          - label: Sự kiện nhóm
            value: group_event
          - label: Cảm xúc
            value: reaction
          - label: Cuộc gọi
            value: call
login_qr:
  name: Đăng nhập Zalo bằng mã QR
  description: Bắt đầu đăng nhập Zalo bằng mã QR theo kiểu đã chọn. Mã hiện ở thực thể ảnh «Mã QR đăng
    nhập» của thiết bị Zalo Call; quét bằng ứng dụng Zalo trên điện thoại rồi xác nhận.
  fields:
    entry_id: *id001
    type:
      name: Kiểu đăng nhập
      description: Web (Qua Web) hoặc PC (Zalo PC), mỗi kiểu có mã QR riêng. Bỏ trống thì giữ kiểu hiện
        tại của app.
      selector:
        select:
          options:
          - label: Web (Qua Web)
            value: web
          - label: PC (Zalo PC)
            value: pc
    force:
      name: Đăng nhập lại dù đang đăng nhập
      description: Mặc định dịch vụ từ chối khi Zalo đang đăng nhập (tránh làm mất phiên). Bật để buộc
        lấy mã QR mới.
      selector:
        boolean: null
logout:
  name: Đăng xuất Zalo
  description: Đăng xuất Zalo (xóa phiên Zalo của app, quay về màn hình mã QR). Tài khoản và mật khẩu
    đăng nhập app vẫn giữ.
  fields:
    entry_id: *id001
end_call:
  name: Kết thúc cuộc gọi
  description: Kết thúc (hoặc huỷ khi còn đổ chuông) cuộc gọi đang có.
  fields:
    entry_id: *id001
    call_id:
      name: Mã cuộc gọi
      description: Bỏ trống để kết thúc cuộc gọi gần nhất.
      selector:
        text: null
alert_call:
  name: Gọi cảnh báo
  description: 'Gọi để BÁO ĐỘNG: người nhận nghe máy, AI đọc nội dung cảnh báo (không hỏi gì), rồi làm
    theo ô «Đọc cảnh báo xong thì». Báo người ngã, có trộm: nên nối thiết bị nhà để người nhận xem hiện
    trường. Báo mất điện, rò nước: đọc xong cúp máy. Đọc xong, Home Assistant bắn sự kiện zalo_call_alert_done
    để automation biết đúng lúc đó.'
  fields:
    entry_id: *id001
    thread_id:
      name: Người cần báo
      description: Mã Zalo của người nhận cảnh báo. Xem danh sách bằng dịch vụ «Xem danh bạ Zalo».
      required: true
      example: '6643404425553198601'
      selector:
        text: null
    message:
      name: Nội dung cảnh báo
      description: Câu được đọc ngay khi người nhận nghe máy.
      required: true
      selector:
        text:
          multiline: true
    type:
      name: Gọi thoại hay gọi video
      description: 'Bỏ trống = tự chọn: có camera sẽ dùng (mặc định cảnh báo dùng tất cả thiết bị đã cài,
        gồm camera) thì gọi video, không thì gọi thoại.'
      selector:
        select:
          options:
          - user
          - video
    after:
      name: Đọc cảnh báo xong thì
      description: 'Cúp máy: hợp báo mất điện, rò nước. Nối thiết bị nhà: hợp báo người ngã, có trộm.
        Giữ máy: người nhận hoặc automation tự cúp (dịch vụ «Kết thúc cuộc gọi»). Bỏ trống = tự chọn:
        có thiết bị để nối thì nối, không thì cúp.'
      selector:
        select:
          options:
          - value: hangup
            label: Cúp máy
          - value: connect
            label: Nối thiết bị nhà
          - value: wait
            label: Giữ máy
    pipeline:
      name: Trợ lý giọng nói (để chọn giọng đọc)
      description: Bỏ trống = theo quy tắc của người này; không có thì giọng đọc mặc định của Home Assistant.
      selector:
        assist_pipeline: null
    speaker:
      name: Loa trong nhà
      description: Loa phát tiếng người nhận sau khi đọc xong. Bỏ trống = theo quy tắc của người này.
      selector:
        entity:
          domain: media_player
    mic:
      name: Mic trong nhà
      description: Mic gửi tiếng trong nhà cho người nhận sau khi đọc xong. Bỏ trống = theo quy tắc.
      selector:
        entity:
          domain:
          - camera
          - assist_satellite
    mic_url:
      name: Mic từ địa chỉ mạng (nâng cao)
      description: Địa chỉ rtsp/http của luồng tiếng, nếu mic không có trong danh sách. Thắng ô Mic.
      selector:
        text: null
    camera:
      name: Camera trong nhà
      description: Camera gửi hình cho người nhận sau khi đọc xong. Bỏ trống = theo quy tắc.
      selector:
        entity:
          domain: camera
    connect:
      name: Thiết bị nhà dùng ngay sau cảnh báo
      description: Tích ô nào thì dùng thứ đó (tích 1 = dùng 1, tích 2 = dùng 2, tích 3 = cả 3). Tích
        Camera = cuộc gọi VIDEO. Bỏ trống = dùng TẤT CẢ thiết bị đã cài, kể cả camera, vì báo động thì
        người nhận phải thấy hiện trường. Muốn chỉ đọc rồi cúp thì chọn Cúp máy ở ô «Đọc cảnh báo xong
        thì».
      selector:
        select:
          options: *id025
          multiple: true
    volume:
      name: Âm lượng loa (%)
      description: Đặt âm lượng khi bật loa, trả lại mức cũ khi cúp. Bỏ trống = giữ nguyên.
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: '%'
    repeat:
      name: Đọc mấy lần
      description: Số lần đọc (1 đến 3).
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    tts_engine:
      name: Giọng đọc riêng
      description: Chọn nếu muốn dùng giọng khác. Bỏ trống = giọng của Trợ lý giọng nói.
      selector:
        entity:
          domain: tts
    language:
      name: Ngôn ngữ
      description: Ví dụ vi. Bỏ trống = theo Trợ lý giọng nói.
      selector:
        text: null
    peer_name:
      name: Tên hiện trong nhật ký
      description: Tên người nhận hiện trong nhật ký cuộc gọi (bỏ trống = dùng mã).
      selector:
        text: null
